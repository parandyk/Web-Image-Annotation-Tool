on:
  push:
    branches: ["decoupling_refactor", "neural"]
    # branches: ["decoupling_refactor"]
    # branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # - uses: actions/checkout@v4
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      #     cache: npm
      #     cache-dependency-path: package-lock.json

      # - run: npm ci
      # - run: npm run build
      #   env:
      #     VITE_BASE_PATH: /Web-Image-Annotation-Tool/
      # - run: mkdir -p combined
      # - run: cp -r dist/* combined/

      - uses: actions/checkout@v4
        with:
          ref: decoupling_refactor
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /Web-Image-Annotation-Tool/
      - run: mkdir -p combined
      - run: cp -r dist/* combined/

      - uses: actions/checkout@v4
        with:
          ref: neural
          clean: false 
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /Web-Image-Annotation-Tool/neural/
      - run: mkdir -p combined/neural
      - run: cp -r dist/* combined/neural/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined
          
      # - run: npm run build
      # - uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
